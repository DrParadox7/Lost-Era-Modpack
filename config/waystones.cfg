# Configuration file

client {
    # If true, activated waystones will not emit particles. [default: false]
    B:disableParticles=false

    # If true, waystone teleports will not play the teleport sound. [default: false]
    B:disableTeleportSound=false

    # If true, render waystones as 2D icons in the inventory instead of 3D models. [default: false]
    B:flatInventoryIcon=false

    # If true, GUI menus pause the game in singleplayer. [default: false]
    B:menusPauseGame=false

    # Per-variant overlay clip bounds in model pixel units. Controls the lower and upper Y extents of the glow overlay on the pillar. Format: variant=<name>;lower=<Y>;upper=<Y> [default: [variant=stone;lower=-22;upper=-44], [variant=sandstone;lower=-22;upper=-38], [variant=mossy;lower=-24;upper=-44], [variant=stonebrick;lower=-26;upper=-44], [variant=mossy_stonebrick;lower=-26;upper=-44], [variant=nether;lower=-24;upper=-44], [variant=end;lower=-24;upper=-42]]
    S:overlayClipBounds <
        variant=stone;lower=-22;upper=-44
        variant=sandstone;lower=-22;upper=-38
        variant=mossy;lower=-24;upper=-44
        variant=stonebrick;lower=-26;upper=-44
        variant=mossy_stonebrick;lower=-26;upper=-44
        variant=nether;lower=-24;upper=-44
        variant=end;lower=-24;upper=-42
     >

    # If true, Waystone glow texture will display the cooldown status. [default: true]
    B:showCooldownOnWaystone=true

    # If true, show a floating nametag with the Waystone's name, above it. [default: false]
    B:showNametag=false

    # The Waystone sorting mode. Alphabetical: 0, Distance: 1. [range: 0 ~ 1, default: 0]
    I:sortingMode=0

    # The x position of the warp button in the inventory. [range: -100 ~ 250, default: 60]
    I:teleportButtonX=60

    # The y position of the warp button in the inventory. [range: -100 ~ 250, default: 60]
    I:teleportButtonY=60
}


general {
    # If true, a waystone is invulnerable to all but the player who named them. [default: false]
    B:"Invulnerable Waystones"=true

    # If true, return scrolls will be found in dungeons as loot. [default: true]
    B:"Spawn Return Scrolls as loot"=true

    # If true, return scrolls will be craftable. [default: true]
    B:allowReturnScrolls=false

    # If true, the warp stone will be craftable. [default: true]
    B:allowWarpStone=false

    # If true, waystones can only be placed in creative mode. [default: false]
    B:creativeModeOnly=false

    # Additional logs [default: false]
    B:debugMode=false

    # If true, waystones will not drop as an item when mined (including Silk Touch). [default: false]
    B:disableWaystoneDrops=false

    # If true, waystones marked as global work inter-dimensionally. [default: true]
    B:globalInterDimension=true

    # If true, waystones marked as global have no cooldown. [default: false]
    B:globalNoCooldown=false

    # If true, all waystones work inter-dimensionally. [default: true]
    B:interDimension=true

    # If true, the player's spawnpoint will be set to the last activated waystone. [default: false]
    B:setSpawnPoint=false

    # Should there be a button in the inventory to access the waystone menu? [default: false]
    B:teleportButton=false

    # The cooldown between usages of the teleport button in seconds. [range: 0 ~ 86400, default: 300]
    I:teleportButtonCooldown=300

    # If true, the teleport button will only let you return to the last activated waystone, instead of allowing to choose. [default: false]
    B:teleportButtonReturnOnly=false

    # The cooldown between usages of the Warp Stone and Waystone in seconds. [range: 0 ~ 86400, default: 300]
    I:warpStoneCooldown=300

    # Light level emitted by waystones. 0 = none, 1 = maximum. [range: 0.0 ~ 1.0, default: 0.5]
    S:waystoneLightLevel=0.5

    # The minimum amount of XP levels consumed when using a Waystone. Set to -1 to disable cost altogether. [range: -1 ~ 2147483647, default: 5]
    I:xpBaseCost=-1

    # Each how many blocks consume one XP level. [range: 0 ~ 2147483647, default: 100]
    I:xpBlocksPerLevel=0

    # How many XP levels are consumed for teleporting to another dimension. [range: 0 ~ 2147483647, default: 5]
    I:xpCrossDimCost=0
}


journeymap {
    # Fixed JourneyMap waypoint color as a hex RGB value. Accepts values like 7FDBFF or #7FDBFF. [default: 7FDBFF]
    S:journeyMapWaypointColor=7FDBFF

    # If true, JourneyMap waypoint colors are derived from the Waystone name instead of using the fixed color. [default: true]
    B:journeyMapWaypointRandomColor=true

    # Vertical offset applied to JourneyMap waypoints relative to the Waystone base block. [range: -2147483648 ~ 2147483647, default: 2]
    I:journeyMapWaypointYOffset=2

    # If true, activating a Waystone adds or updates a JourneyMap waypoint for it. [default: true]
    B:journeyMapWaypoints=true
}


worldgen {
    # If true, generate a Waystone in each village. [default: true]
    B:enableWorldgen=false

    # List of path/surface blocks that should make village-generated Waystones use the mossy variant. [default: ]
    S:mossyWaystonePathBlocks <
     >

    # List of path/surface blocks that should make village-generated Waystones use the sandy variant. [default: [minecraft:sandstone]]
    S:sandyWaystonePathBlocks <
        minecraft:sandstone
     >

    # How waystones generate in structures. One rule per structure id. Format: structure=<id>;chance=<0..1>;type=<auto|stone|sandy|mossy|stonebrick|mossystonebrick|nether|end>;name=<override>;forceGlobal=<true|false>;autoActivateGlobal=<true|false>;dimensionWhitelist=<*|0,-1,1>;biomeWhitelist=<*|2,17,21> [default: [structure=village;chance=1;type=auto], [structure=temple_desert;chance=1;type=sandy], [structure=temple_jungle;chance=1;type=auto], [structure=stronghold;chance=1;type=auto], [structure=fortress;chance=1;type=nether], [structure=end_spike;chance=1;type=end], [structure=world_spawn;chance=1;type=stone;dimensionWhitelist=0]]
    S:structureWaystoneRules <
    >

    # If true, village Waystones will take their name from Village Names. [default: true]
    B:villageNamesCompat=false
}


xaerominimap {
    # Fixed Xaero's Minimap waypoint color index. Uses Xaero's 0-15 color palette. [range: 0 ~ 15, default: 11]
    I:xaeroMinimapWaypointColor=11

    # If true, Xaero's Minimap waypoint colors are derived from the Waystone name instead of using the fixed color. [default: true]
    B:xaeroMinimapWaypointRandomColor=true

    # Vertical offset applied to Xaero's Minimap waypoints relative to the Waystone base block. [range: -2147483648 ~ 2147483647, default: 2]
    I:xaeroMinimapWaypointYOffset=2

    # If true, activating a Waystone adds or updates a Xaero's Minimap waypoint for it. [default: true]
    B:xaeroMinimapWaypoints=true
}